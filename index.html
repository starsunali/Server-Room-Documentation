<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RackFlow — Sign in</title>
<meta name="description" content="RackFlow — lightweight infrastructure rack & device management.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script>(function(){try{var t=localStorage.getItem('rackflow.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body class="page-auth">
<main class="auth-wrap">
  <section class="auth-card" aria-labelledby="brandTitle">
    <header class="brand">
      <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
      <div>
        <h1 id="brandTitle">RackFlow</h1>
        <p class="brand-sub">Lightweight infrastructure rack &amp; device management</p>
      </div>
    </header>

    <form id="loginForm" novalidate>
      <label class="field">
        <span>Username</span>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="admin" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>

      <div class="auth-row">
        <label class="chk"><input type="checkbox" id="remember"> <span>Remember me</span></label>
        <button type="button" class="theme-btn" data-act="theme" aria-label="Toggle color theme"></button>
      </div>

      <div class="captcha" aria-hidden="true">
        <div class="captcha-box">
          <span class="captcha-mark"></span>
          <span class="captcha-text">CAPTCHA placeholder — wired up in the PHP build</span>
          <span class="badge">DEMO</span>
        </div>
      </div>

      <div class="auth-error" id="loginError" role="alert" aria-live="assertive"></div>

      <button class="btn primary block" id="signinBtn" type="submit">Sign in</button>
    </form>

    <footer class="demo-creds">
      <strong>Demo accounts</strong>
      <div class="cred-row"><code>admin / admin</code> <span>admin · Users, Racks, Dashboard</span></div>
      <div class="cred-row"><code>liam · noor · yuki / user</code> <span>active users · Dashboard</span></div>
      <div class="cred-row"><code>diego / user</code> <span>inactive · sign-in blocked</span></div>
    </footer>
  </section>
</main>

<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
