<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RackFlow — Dashboard</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script>(function(){try{var t=localStorage.getItem('rackflow.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body class="page-app" data-page="dashboard">
<div id="topbar"></div>

<main class="wrap">
  <header class="page-head">
    <div>
      <h1>Infrastructure overview</h1>
      <p class="page-sub">Live rack view · read-only</p>
    </div>
    <div class="head-actions">
      <label class="search">
        <span class="search-glyph" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Search devices by name…" aria-label="Search devices by name">
      </label>
    </div>
  </header>

  <p id="countLine" class="count-line">— racks · — devices</p>

  <div id="bannerRoot"></div>
  <section id="rackGrid" class="rack-grid" aria-label="Racks"></section>
  <p id="emptyState" class="empty" hidden>No devices match your search.</p>
</main>

<div id="modalRoot"></div>
<div id="zoomRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
